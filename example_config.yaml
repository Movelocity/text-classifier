# 示例训练配置文件
# 使用方法: python main.py --config example_config.yaml

# 数据相关配置
data_split_ratio: [0.8, 0.1, 0.1]  # 训练:验证:测试 = 8:1:1
batch_size: 24                     # 批次大小，根据显存调整
max_length: 256                    # 最大序列长度
shuffle_train: true                # 是否打乱训练数据
random_seed: 42                    # 随机种子，确保可重复性

# 模型相关配置
model_name: "roberta-base"         # 预训练模型名称
problem_type: "multi_label_classification"  # 多标签分类

# LoRA微调配置
use_lora: true                     # 启用LoRA微调
lora_r: 48                         # LoRA rank，控制参数量
lora_alpha: 24                     # LoRA scaling factor
lora_dropout: 0.3                  # LoRA dropout率

# 训练相关配置
num_epochs: 12                     # 训练轮数
learning_rate: 0.0002              # 学习率 (2e-4)
weight_decay: 0.01                 # 权重衰减
warmup_ratio: 0.06                 # 预热比例
gradient_accumulation_steps: 4     # 梯度累积步数
max_grad_norm: 1.1                 # 梯度裁剪阈值

# 保存和日志配置
save_dir: "models"                 # 模型保存目录
save_steps: 500                    # 保存检查点的步数间隔
eval_steps: 500                    # 评估的步数间隔
logging_steps: 100                 # 日志记录的步数间隔
save_total_limit: 3                # 最多保存的检查点数量

# 设备配置
device: "auto"                     # 自动选择设备 (auto/cpu/cuda)

# 数据加载配置
dataloader_num_workers: 0          # 数据加载器进程数

# 注意事项:
# 1. batch_size 过大可能导致显存不足，建议从小开始调整
# 2. learning_rate 建议从 1e-4 到 5e-4 之间尝试
# 3. num_epochs 可以根据验证集性能动态调整
# 4. 使用LoRA可以大幅减少显存占用和训练时间 